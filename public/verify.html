<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알바가드 기록 등록 확인</title>
<link rel="icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f4f3ef; color: #15171a; font-family: 'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #5d636d; font-size: 14px; margin: 0 0 24px; line-height: 1.6; }
  label { display: block; font-size: 13px; color: #5d636d; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid #dcd9d0; border-radius: 12px; background: #fff; }
  button { margin-top: 10px; width: 100%; font: inherit; font-size: 16px; font-weight: 700; padding: 14px; border: 0; border-radius: 14px; background: #2a3193; color: #fff; }
  .result { margin-top: 24px; padding: 18px; border-radius: 14px; background: #fff; border: 1px solid #dcd9d0; }
  .ok { border-color: #0f7a55; }
  .ok h2 { color: #0f7a55; }
  .no h2 { color: #c2331c; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  dl { margin: 0; font-size: 14px; }
  dt { color: #5d636d; margin-top: 10px; }
  dd { margin: 2px 0 0; word-break: break-all; font-variant-numeric: tabular-nums; }
  .note { font-size: 12.5px; color: #8b9099; line-height: 1.6; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>기록 등록 확인</h1>
  <p class="sub">알바가드 증빙 묶음에 적힌 <b>확인 번호</b>를 넣으면, 그 기록이 서버에 언제 등록됐는지 보여 줍니다.</p>
  <label for="h">확인 번호</label>
  <input id="h" placeholder="예: 3f9a1c0b7e2d4a65" autocomplete="off" spellcheck="false">
  <button id="go">확인하기</button>
  <div id="out"></div>
  <p class="note">
    확인 번호는 기록 내용으로 만든 번호로, 내용이 조금이라도 바뀌면 완전히 달라집니다. 서버에는 확인 번호와 등록 시각만 저장되며, 근무지·시각·금액 같은 내용은 저장되지 않습니다.
    등록 시각은 서버가 찍은 것이고 등록된 줄은 고치거나 지울 수 없습니다. 이 확인은 "그 내용이 그 시각에 존재했고 그 뒤 바뀌지 않았다"는 것을 보여 줄 뿐,
    문서의 법적 효력이나 증거 인정을 보장하지 않습니다.
  </p>
</main>
<script>
  const URL_ = 'https://jejrynhqdvckspntpkxj.supabase.co'
  const KEY = 'sb_publishable_ZFLR4ZMjc85JAnWl7bdwCw_y5AHMJnn'
  const input = document.getElementById('h')
  const out = document.getElementById('out')
  const fmt = (iso) => {
    const d = new Date(iso)
    const p = (n) => String(n).padStart(2, '0')
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} (한국 시각 기준은 폰 설정에 따름)`
  }
  async function check() {
    const h = input.value.trim().toLowerCase().replace(/[^0-9a-f]/g, '')
    if (h.length < 8) { out.innerHTML = '<div class="result no"><h2>확인 번호를 8자 이상 넣어 주세요</h2></div>'; return }
    out.innerHTML = '<div class="result"><h2>확인하는 중…</h2></div>'
    try {
      const q = h.length >= 64 ? `hash=eq.${h}` : `hash=like.${h}*`
      const res = await fetch(`${URL_}/rest/v1/stamps?${q}&select=hash,created_at&limit=2`, { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } })
      const rows = await res.json()
      if (!Array.isArray(rows) || rows.length === 0) {
        out.innerHTML = '<div class="result no"><h2>등록된 확인 번호가 없습니다</h2><p class="sub" style="margin:0">번호를 다시 확인해 주세요. 앱에서 등록을 꺼 두었거나, 인터넷이 없을 때 남긴 기록은 등록되지 않았을 수 있습니다.</p></div>'
        return
      }
      const r = rows[0]
      out.innerHTML = `<div class="result ok"><h2>등록된 기록입니다</h2><dl><dt>서버 등록 시각</dt><dd>${fmt(r.created_at)}</dd><dt>확인 번호 전체</dt><dd>${r.hash}</dd></dl></div>`
    } catch (e) {
      out.innerHTML = '<div class="result no"><h2>확인하지 못했어요</h2><p class="sub" style="margin:0">잠시 뒤 다시 시도해 주세요.</p></div>'
    }
  }
  document.getElementById('go').onclick = check
  input.onkeydown = (e) => { if (e.key === 'Enter') check() }
  const fromUrl = new URLSearchParams(location.search).get('h')
  if (fromUrl) { input.value = fromUrl; check() }
</script>
</body>
</html>
